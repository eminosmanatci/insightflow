services:
  db:
    image: postgres:15-alpine
    container_name: insightflow_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insightflow_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: insightflow_backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - dataset_uploads:/data/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    container_name: insightflow_celery
    command:
      - celery
      - -A
      - app.core.celery_app:celery_app
      - worker
      - --loglevel=info
    volumes:
      - ./backend:/app
      - dataset_uploads:/data/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: insightflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  dataset_uploads:
    
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: insightflow_db
    restart: always
    environment:
      POSTGRES_USER: insight_admin
      POSTGRES_PASSWORD: secret_password123
      POSTGRES_DB: insightflow_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insightflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightflow_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://insight_admin:secret_password123@db:5432/insightflow_prod
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/backend

  frontend:
    build: ./frontend
    container_name: insightflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web  # Buradaki isim yukarıdaki backend servisinin adı olan 'web' ile eşleşmelidir.

volumes:
  postgres_data:
  redis_data:
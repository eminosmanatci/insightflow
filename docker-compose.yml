version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: insightflow_db
    environment:
      POSTGRES_USER: insight_admin
      POSTGRES_PASSWORD: secret_password123
      POSTGRES_DB: insightflow_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insightflow_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: insightflow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://insight_admin:secret_password123@db:5432/insightflow_prod
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    container_name: insightflow_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://insight_admin:secret_password123@db:5432/insightflow_prod
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: insightflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
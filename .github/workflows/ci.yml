name: InsightFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      GROQ_API_KEY: ci-placeholder-key
      UPLOAD_DIR: /tmp/insightflow-uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            --default-timeout=120 \
            --retries 10 \
            -r requirements.txt

      - name: Run backend tests with coverage gate
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q

  migration-check:
    name: Alembic Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: insight_admin
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: insightflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insight_admin -d insightflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://insight_admin:ci_postgres_password@localhost:5432/insightflow_ci
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      GROQ_API_KEY: ci-placeholder-key
      UPLOAD_DIR: /tmp/insightflow-uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            --default-timeout=120 \
            --retries 10 \
            -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migration state
        run: |
          alembic current
          alembic check

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
